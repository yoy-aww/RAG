<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG 智能问答</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; background: #f0f2f5; min-height: 100vh; }

.header { background: #2563eb; color: #fff; padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 20px; font-weight: 600; }
.header .info { font-size: 13px; opacity: .85; }

.container { max-width: 900px; margin: 24px auto; padding: 0 16px; display: flex; flex-direction: column; gap: 20px; }

.card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.06); overflow: hidden; }
.card-header { padding: 14px 20px; border-bottom: 1px solid #f0f0f0; font-size: 15px; font-weight: 600; color: #1f2937; display: flex; align-items: center; gap: 8px; }
.card-body { padding: 20px; }

/* 状态栏 */
.status-bar { display: flex; gap: 24px; flex-wrap: wrap; }
.status-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6b7280; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; }
.status-dot.green { background: #22c55e; }
.status-dot.yellow { background: #eab308; }
.status-dot.red { background: #ef4444; }

/* 问答区 */
.chat-area { min-height: 300px; max-height: 460px; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #fafbfc; }
.msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; word-break: break-word; }
.msg-user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
.msg-bot { align-self: flex-start; background: #fff; color: #1f2937; border: 1px solid #e5e7eb; border-bottom-left-radius: 4px; }
.msg-sources { font-size: 12px; color: #6b7280; margin-top: 8px; padding-top: 8px; border-top: 1px solid #f0f0f0; }
.msg-sources span { background: #f3f4f6; padding: 2px 8px; border-radius: 4px; margin-right: 4px; }
.msg-error { align-self: flex-start; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
.msg-loading { align-self: flex-start; color: #9ca3af; font-size: 13px; padding: 10px 14px; }

.input-row { display: flex; gap: 8px; padding: 16px 20px; border-top: 1px solid #f0f0f0; }
.input-row input { flex: 1; border: 1px solid #d1d5db; border-radius: 8px; padding: 10px 14px; font-size: 14px; outline: none; transition: border-color .2s; }
.input-row input:focus { border-color: #2563eb; }
.input-row button { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; cursor: pointer; transition: background .2s; }
.input-row button:hover { background: #1d4ed8; }
.input-row button:disabled { opacity: .5; cursor: not-allowed; }

/* 上传区 */
.upload-area { border: 2px dashed #d1d5db; border-radius: 8px; padding: 24px; text-align: center; cursor: pointer; transition: border-color .2s; }
.upload-area:hover { border-color: #2563eb; }
.upload-area p { color: #6b7280; font-size: 14px; }
.upload-area .icon { font-size: 28px; margin-bottom: 8px; }
.upload-result { margin-top: 12px; font-size: 13px; color: #16a34a; }

/* 搜索区 */
.search-results { font-size: 14px; }
.search-item { padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 8px; }
.search-item .score { font-size: 12px; color: #2563eb; font-weight: 600; }
.search-item .doc { font-size: 12px; color: #6b7280; margin-bottom: 4px; }
.search-item .text { color: #374151; line-height: 1.5; }

/* tabs */
.tabs { display: flex; gap: 0; }
.tab { padding: 14px 20px; font-size: 14px; color: #6b7280; cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s; }
.tab:hover { color: #2563eb; }
.tab.active { color: #2563eb; border-bottom-color: #2563eb; font-weight: 600; }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* 清空按钮 */
.btn-danger { background: #ef4444; color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer; }
.btn-danger:hover { background: #dc2626; }
.btn-small { background: #f3f4f6; color: #374151; border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
.btn-small:hover { background: #e5e7eb; }

.empty-hint { text-align: center; color: #9ca3af; padding: 40px 0; font-size: 14px; }
</style>
</head>
<body>

<div class="header">
  <h1>RAG 智能问答</h1>
  <div class="info" id="statusText">连接中...</div>
</div>

<div class="container">

  <!-- 状态 -->
  <div class="card">
    <div class="card-header">&#9679; 知识库状态</div>
    <div class="card-body">
      <div class="status-bar" id="statusBar">
        <div class="status-item"><span class="status-dot yellow" id="dotBackend"></span> 后端：<span id="backendStatus">检测中</span></div>
        <div class="status-item"><span class="status-dot yellow" id="dotChunks"></span> 文档段数：<span id="chunkCount">-</span></div>
        <div class="status-item"><span class="status-dot yellow" id="dotModel"></span> 嵌入模型：<span id="modelName">-</span></div>
        <div class="status-item"><span class="status-dot yellow" id="dotLLM"></span> LLM：<span id="llmName">-</span></div>
        <div style="margin-left:auto"><button class="btn-danger" onclick="clearKB()">清空知识库</button></div>
      </div>
    </div>
  </div>

  <!-- 功能区 -->
  <div class="card">
    <div class="tabs">
      <div class="tab active" data-tab="chat" onclick="switchTab('chat')">智能问答</div>
      <div class="tab" data-tab="search" onclick="switchTab('search')">向量检索</div>
      <div class="tab" data-tab="upload" onclick="switchTab('upload')">上传文档</div>
    </div>

    <!-- 问答 -->
    <div class="tab-content active" id="tab-chat">
      <div class="chat-area" id="chatArea">
        <div class="empty-hint">知识库为空时请先上传文档，然后在此输入问题</div>
      </div>
      <div class="input-row">
        <input id="askInput" placeholder="输入问题，按回车发送..." autocomplete="off">
        <button id="askBtn" onclick="doAsk()">发送</button>
      </div>
    </div>

    <!-- 检索 -->
    <div class="tab-content" id="tab-search">
      <div class="card-body">
        <div class="input-row" style="padding:0 0 16px 0; border:none;">
          <input id="searchInput" placeholder="输入关键词检索..." autocomplete="off">
          <button onclick="doSearch()">检索</button>
        </div>
        <div class="search-results" id="searchResults">
          <div class="empty-hint">输入关键词进行语义检索</div>
        </div>
      </div>
    </div>

    <!-- 上传 -->
    <div class="tab-content" id="tab-upload">
      <div class="card-body">
        <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
          <div class="icon">&#128196;</div>
          <p>点击选择文件上传（支持 txt/md/csv/html/xml/pdf/docx/xlsx）</p>
        </div>
        <input type="file" id="fileInput" accept=".txt,.md,.csv,.html,.xml,.pdf,.docx,.xlsx" style="display:none" onchange="doUpload(this)">
        <div class="upload-result" id="uploadResult"></div>
      </div>
    </div>
  </div>

</div>

<script>
var API = 'http://127.0.0.1:8000';

// ---- 状态 ----
async function refreshInfo() {
  try {
    var r = await fetch(API + '/info');
    var j = await r.json();
    document.getElementById('dotBackend').className = 'status-dot green';
    document.getElementById('backendStatus').textContent = '已连接';
    document.getElementById('dotChunks').className = 'status-dot ' + (j.chunks > 0 ? 'green' : 'yellow');
    document.getElementById('chunkCount').textContent = j.chunks;
    document.getElementById('dotModel').className = 'status-dot green';
    document.getElementById('modelName').textContent = (j.model || '').split('/').pop();
    document.getElementById('dotLLM').className = 'status-dot green';
    document.getElementById('llmName').textContent = j.llm || '-';
    document.getElementById('statusText').textContent = '已连接 · ' + j.chunks + ' 段文档';
  } catch(e) {
    document.getElementById('dotBackend').className = 'status-dot red';
    document.getElementById('backendStatus').textContent = '未连接';
    document.getElementById('statusText').textContent = '后端未连接，请先启动 main.py serve';
  }
}

// ---- Tab 切换 ----
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.dataset.tab === name); });
  document.querySelectorAll('.tab-content').forEach(function(t) { t.classList.toggle('active', t.id === 'tab-' + name); });
}

// ---- 问答 ----
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }

function addChatMsg(html, cls) {
  var area = document.getElementById('chatArea');
  var hint = area.querySelector('.empty-hint');
  if (hint) hint.remove();
  var d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerHTML = html;
  area.appendChild(d);
  area.scrollTop = area.scrollHeight;
}

async function doAsk() {
  var input = document.getElementById('askInput');
  var q = input.value.trim();
  if (!q) return;
  input.value = '';
  document.getElementById('askBtn').disabled = true;

  addChatMsg(esc(q), 'msg-user');

  var loader = document.createElement('div');
  loader.className = 'msg-loading';
  loader.textContent = '思考中...';
  document.getElementById('chatArea').appendChild(loader);

  try {
    var r = await fetch(API + '/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q })
    });
    var j = await r.json();
    loader.remove();
    var srcHtml = '';
    if (j.sources && j.sources.length) {
      var tags = j.sources.slice(0, 5).map(function(s) { return '<span>' + esc(s.doc || '未知') + '</span>'; }).join('');
      srcHtml = '<div class="msg-sources">来源：' + tags + '</div>';
    }
    addChatMsg(esc(j.answer || '（无回答）') + srcHtml, 'msg-bot');
  } catch(e) {
    loader.remove();
    addChatMsg('请求失败，请确认后端服务已启动', 'msg-error');
  }
  document.getElementById('askBtn').disabled = false;
  input.focus();
}

document.getElementById('askInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doAsk(); }
});

// ---- 检索 ----
async function doSearch() {
  var q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  var container = document.getElementById('searchResults');
  container.innerHTML = '<div class="msg-loading">检索中...</div>';

  try {
    var r = await fetch(API + '/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q })
    });
    var j = await r.json();
    if (!j.results || !j.results.length) {
      container.innerHTML = '<div class="empty-hint">未找到相关内容</div>';
      return;
    }
    container.innerHTML = j.results.map(function(item) {
      return '<div class="search-item"><div class="doc">' + esc(item.doc || '未知') +
             ' · <span class="score">相似度 ' + (item.score || 0).toFixed(3) + '</span></div>' +
             '<div class="text">' + esc(item.text || '') + '</div></div>';
    }).join('');
  } catch(e) {
    container.innerHTML = '<div class="empty-hint">请求失败，请确认后端服务已启动</div>';
  }
}

document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); doSearch(); }
});

// ---- 上传 ----
async function doUpload(fileInput) {
  var file = fileInput.files[0];
  if (!file) return;
  var result = document.getElementById('uploadResult');
  result.textContent = '上传中...';

  var fd = new FormData();
  fd.append('file', file);
  try {
    var r = await fetch(API + '/ingest/file', { method: 'POST', body: fd });
    var j = await r.json();
    result.textContent = '上传成功！新增 ' + j.chunks_added + ' 个文档段';
    refreshInfo();
  } catch(e) {
    result.textContent = '上传失败，请确认后端服务已启动';
  }
  fileInput.value = '';
}

// ---- 清空 ----
async function clearKB() {
  if (!confirm('确定清空知识库？此操作不可恢复。')) return;
  try {
    await fetch(API + '/clear', { method: 'DELETE' });
    refreshInfo();
    document.getElementById('chatArea').innerHTML = '<div class="empty-hint">知识库已清空</div>';
  } catch(e) { alert('操作失败'); }
}

// 初始化
refreshInfo();
setInterval(refreshInfo, 10000);
</script>
</body>
</html>
