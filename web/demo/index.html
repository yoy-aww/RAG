<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><title>RAG 嵌入演示</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif;margin:40px;background:#f8fafc;}
.card{max-width:720px;background:#fff;padding:32px;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.06);line-height:1.7;}
h1{font-size:22px;color:#0f172a;}code{background:#e2e8f0;padding:2px 6px;border-radius:4px;font-size:13px;}
pre{background:#0f172a;color:#e2e8f0;padding:16px;border-radius:10px;overflow-x:auto;font-size:13px;}</style>
</head>
<body>
<div class="card">
<h1>RAG 智能问答 · 客户嵌入演示</h1>
<p>这是客户的网站/系统页面。右下角浮窗就是你的 RAG 问答服务。</p>
<p><strong>嵌入代码（客户只需加一行）：</strong></p>
<pre>&lt;script src="../widget/rag-widget.js"
        data-rag-api="http://127.0.0.1:8000"
        data-rag-lang="zh"
        data-rag-title="智能问答"&gt;&lt;/script&gt;</pre>
<p>注意：演示模式下后端地址为本地 <code>127.0.0.1:8000</code>，需先启动 <code>main.py serve</code>。</p>
</div>
<!-- 嵌入你的 RAG 浮窗（一行） -->
<script src="../widget/rag-widget.js" data-rag-api="http://127.0.0.1:8000" data-rag-lang="zh" data-rag-title="智能问答"></script>
</body></html>
